<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#101622" />
  <title>My Semester</title>
  <meta name="description" content="시간표, 수업계획, 과제와 메모를 한곳에서 정리하는 개인 학기 대시보드" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script>
    try {
      const savedTheme = localStorage.getItem("my-semester:theme");
      const theme = savedTheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="style.css?v=20260903-order" />
</head>
<body>
  <a class="skip-link" href="#mainContent">본문으로 건너뛰기</a>

  <aside class="course-dock" id="courseDock" aria-label="과목 선택 메뉴">
    <button class="course-dock-handle" id="courseDockHandle" type="button" aria-expanded="false" aria-controls="coursePanel">
      <span class="handle-lines" aria-hidden="true"></span>
      <span class="sr-only">과목 목록 열기</span>
    </button>
    <nav class="course-panel" id="coursePanel">
      <div class="course-panel-head">
        <span class="brand-mark">M</span>
        <div>
          <strong>MY SEMESTER</strong>
          <small>2026 · 2학기</small>
        </div>
      </div>
      <p class="course-panel-label">과목</p>
      <div class="course-nav" id="courseNav"></div>
      <div class="data-tools" aria-label="데이터 관리">
        <p class="course-panel-label">데이터</p>
        <div class="data-tool-grid">
          <button type="button" id="exportDataButton">백업</button>
          <button type="button" id="importDataButton">불러오기</button>
          <button type="button" id="resetDataButton">초기화</button>
        </div>
        <small>이 노트북의 브라우저에 자동 저장돼요.</small>
      </div>
    </nav>
  </aside>

  <header class="topbar">
    <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="과목 메뉴 열기" aria-controls="coursePanel" aria-expanded="false">
      <span aria-hidden="true">☰</span>
    </button>
    <button class="brand" type="button" data-view="schedule" aria-label="전체 시간표로 이동">
      <span class="brand-mark">M</span>
      <span class="brand-copy">
        <strong>MY SEMESTER</strong>
        <small>2026 · 2학기</small>
      </span>
    </button>
    <nav class="top-tabs" aria-label="주요 화면">
      <button class="top-tab active" type="button" data-view="schedule" aria-current="page">시간표</button>
      <button class="top-tab" type="button" data-view="tasks">체크리스트</button>
      <button class="top-tab" type="button" data-view="calendar">캘린더</button>
      <button class="top-tab" type="button" data-view="exams">시험</button>
      <button class="top-tab" type="button" data-view="chapel">채플</button>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="라이트 모드로 전환">
      <span class="theme-toggle-icon" aria-hidden="true"></span>
      <span class="theme-toggle-label">DARK</span>
    </button>
  </header>

  <main class="app-shell" id="mainContent">
    <section class="view active" id="view-schedule" data-view-panel="schedule">
      <div class="page-heading">
        <div>
          <p class="eyebrow">WEEKLY VIEW</p>
          <h1>전체 시간표</h1>
          <p>과목을 누르면 교수님과 강의실 정보를 바로 확인할 수 있어요.</p>
        </div>
        <div class="week-chip" aria-label="현재 학기">
          <span>2026</span>
          <strong>2학기</strong>
        </div>
      </div>

      <div class="schedule-layout">
        <section class="schedule-card" aria-label="주간 수업 시간표">
          <div class="schedule-scroll">
            <div class="timetable" id="timetable"></div>
          </div>
        </section>

        <aside class="course-peek" id="coursePeek" aria-live="polite">
          <div class="peek-empty">
            <span class="peek-orbit" aria-hidden="true"></span>
            <p class="eyebrow">QUICK LOOK</p>
            <h2>과목을 선택해 주세요</h2>
            <p>시간표 안의 과목을 누르면 간단한 수업 정보를 보여드려요.</p>
          </div>
        </aside>
      </div>

      <section class="online-strip" aria-labelledby="onlineHeading">
        <div>
          <p class="eyebrow">ONLINE CLASS</p>
          <h2 id="onlineHeading">시간이 정해지지 않은 수업</h2>
        </div>
        <div class="online-cards" id="onlineCards"></div>
      </section>
    </section>

    <section class="view placeholder-view" id="view-tasks" data-view-panel="tasks" hidden></section>
    <section class="view placeholder-view" id="view-calendar" data-view-panel="calendar" hidden></section>
    <section class="view placeholder-view" id="view-exams" data-view-panel="exams" hidden></section>
    <section class="view placeholder-view" id="view-chapel" data-view-panel="chapel" hidden></section>
    <section class="view placeholder-view" id="view-course" data-view-panel="course" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="importDataInput" type="file" accept="application/json,.json" hidden />
  <dialog class="editor-dialog" id="editorDialog" aria-labelledby="dialogTitle">
    <div class="dialog-frame">
      <div class="dialog-head">
        <div>
          <p class="eyebrow" id="dialogEyebrow">EDIT</p>
          <h2 id="dialogTitle">정보 수정</h2>
        </div>
        <button class="dialog-close" id="dialogCloseButton" type="button" aria-label="창 닫기">×</button>
      </div>
      <form id="editorForm"></form>
    </div>
  </dialog>
  <script src="data.js?v=20260903-order"></script>
  <script src="app.js?v=20260903-order"></script>
</body>
</html>
